# Happy Hearts Co. — Netlify Configuration

[build]
  publish = "."

# Pretty URLs — /events works without /events/index.html
[[redirects]]
  from = "/events/past"
  to   = "/events/index.html"
  status = 200
  query = {past = "true"}

# SPA-style fallback for any unmatched route → 404
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
